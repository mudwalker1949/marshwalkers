<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Marshwalkers Visible Test</title>
<style>
  html, body {
    margin:0;
    padding:0;
    background:#061107;
    color:#e8dfb9;
    font-family: monospace;
    overflow:hidden;
    touch-action:none;
  }
  #wrap {
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  canvas {
    width:96vw;
    max-width:900px;
    aspect-ratio:16/9;
    background:#9caf8c;
    border:4px solid #334c2f;
    image-rendering: pixelated;
  }
  #controls {
    display:flex;
    gap:14px;
    justify-content:center;
    align-items:center;
    width:100%;
  }
  button {
    font-size:24px;
    padding:18px 24px;
    border-radius:14px;
    border:3px solid #8c7a4f;
    background:#20331f;
    color:#fff2c8;
    font-family: monospace;
  }
  #title {font-size:18px; text-align:center;}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">MARSHWALKERS — VISIBLE MOBILE TEST</div>
  <canvas id="game" width="960" height="540"></canvas>
  <div id="controls">
    <button id="left">◀</button>
    <button id="right">▶</button>
    <button id="jump">▲ Jump</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:170,y:322,vx:0,vy:0,grounded:true,dir:1};
let press = {left:false,right:false,jump:false};

function bind(id, key){
  const b=document.getElementById(id);
  b.addEventListener("touchstart", e=>{e.preventDefault(); press[key]=true;}, {passive:false});
  b.addEventListener("touchend", e=>{e.preventDefault(); press[key]=false;}, {passive:false});
  b.addEventListener("mousedown", e=>{press[key]=true;});
  b.addEventListener("mouseup", e=>{press[key]=false;});
  b.addEventListener("mouseleave", e=>{press[key]=false;});
}
bind("left","left"); bind("right","right"); bind("jump","jump");

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") press.left=true;
  if(e.key==="ArrowRight") press.right=true;
  if(e.key===" " || e.key==="ArrowUp") press.jump=true;
});
document.addEventListener("keyup", e=>{
  if(e.key==="ArrowLeft") press.left=false;
  if(e.key==="ArrowRight") press.right=false;
  if(e.key===" " || e.key==="ArrowUp") press.jump=false;
});

function rect(x,y,w,h,c){ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h);}

function drawBg(){
  rect(0,0,960,540,"#a5b991");
  rect(0,245,960,145,"#6f9aa0");
  for(let i=0;i<18;i++){
    rect(i*60,195+(i%3)*16,46,88,"#6f856b");
  }
  rect(0,385,960,80,"#5d8239");
  rect(0,452,960,88,"#2d2419");
  for(let i=0;i<960;i+=34){
    rect(i,456,26,30,"#4b3820");
  }
  rect(80,315,18,70,"#5b3b1b");
  rect(110,300,16,85,"#7b4e20");
  rect(760,330,95,55,"#4b3520");
  rect(775,310,65,25,"#35512d");
  ctx.fillStyle="#f1e6b8";
  ctx.font="22px monospace";
  ctx.fillText("Goal: walk to Reedbeard's Hut", 24, 42);
}

function drawGator(){
  const x=player.x, y=player.y;
  ctx.save();
  if(player.dir<0){
    ctx.translate(x+62,0);
    ctx.scale(-1,1);
    ctx.translate(-(x+62),0);
  }

  // tail
  rect(x+72,y+82,78,18,"#4d782d");
  rect(x+126,y+91,36,12,"#3f6928");

  // legs
  rect(x+42,y+96,17,42,"#4f7b31");
  rect(x+82,y+96,18,42,"#4f7b31");
  rect(x+36,y+134,32,12,"#6a3f20");
  rect(x+78,y+134,34,12,"#6a3f20");

  // suit body
  rect(x+35,y+48,70,62,"#efe1bd");
  ctx.strokeStyle="#c6b27e"; ctx.lineWidth=3;
  for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(x+40+i*8,y+50);ctx.lineTo(x+40+i*8,y+110);ctx.stroke();}
  rect(x+35,y+48,70,10,"#d9c595");

  // head/snout
  rect(x+25,y+10,62,48,"#5f8535");
  rect(x-35,y+18,72,28,"#5f8535");
  rect(x-30,y+38,75,14,"#d4b65d");
  rect(x-26,y+12,8,8,"#1a1a12");
  rect(x+3,y+12,8,8,"#1a1a12");

  // eyes sleepy
  rect(x+36,y+9,15,13,"#e9e3c8");
  rect(x+64,y+9,15,13,"#e9e3c8");
  rect(x+40,y+14,13,5,"#111");
  rect(x+68,y+14,13,5,"#111");

  // horns
  rect(x+45,y-16,8,28,"#c5924b");
  rect(x+73,y-16,8,28,"#c5924b");
  rect(x+49,y-22,8,8,"#e2bd73");
  rect(x+77,y-22,8,8,"#e2bd73");

  // teeth
  for(let i=0;i<7;i++){rect(x-24+i*10,y+45,5,8,"#fff4d9");}

  // fish
  rect(x+46,y+63,75,23,"#6f9fb0");
  rect(x+112,y+59,24,33,"#466a78");
  rect(x+52,y+69,8,8,"#e2b94d");
  rect(x+54,y+71,4,4,"#111");

  // arm over fish
  rect(x+30,y+62,20,14,"#4f7b31");
  rect(x+76,y+78,18,14,"#4f7b31");

  ctx.restore();
}

function update(){
  if(press.left){player.vx=-4; player.dir=-1;}
  else if(press.right){player.vx=4; player.dir=1;}
  else player.vx*=0.78;

  if(press.jump && player.grounded){
    player.vy=-13;
    player.grounded=false;
  }
  player.vy+=0.65;
  player.x+=player.vx;
  player.y+=player.vy;
  if(player.y>322){player.y=322; player.vy=0; player.grounded=true;}
  if(player.x<20) player.x=20;
  if(player.x>760) player.x=760;
}

function loop(){
  update();
  drawBg();
  drawGator();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
